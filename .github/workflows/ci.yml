name: source-release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Core, perspectives, replay, Agent and public examples
        run: >-
          PYTHONDONTWRITEBYTECODE=1 pytest -p no:cacheprovider
          tests/test_joint_tick_semantics.py
          tests/test_source_release_example.py
          tests/test_public_battlefield_demo.py
          tests/test_source_perspectives.py
          tests/test_replay.py
          tests/test_random_product_seat_agent.py -q

  controller-realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Product, realtime Agent and continuous Web paths
        run: >-
          PYTHONDONTWRITEBYTECODE=1 pytest -p no:cacheprovider
          tests/test_product_operations.py
          tests/test_realtime_agent_session.py
          tests/test_realtime_agent_runner.py
          tests/test_realtime_dual_side_control.py -q

  frontend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e ".[dev]"
      - name: Execute static JavaScript contracts under Node
        run: >-
          PYTHONDONTWRITEBYTECODE=1 pytest -p no:cacheprovider
          tests/test_live_action_interaction.py
          tests/test_viewer_map_renderer.py -q

  full-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Full Python regression
        run: PYTHONDONTWRITEBYTECODE=1 pytest -p no:cacheprovider -q
