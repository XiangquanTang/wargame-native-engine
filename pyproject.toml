[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wargame-native-engine"
version = "0.4.1"
description = "A transparent, deterministic, SDK-independent native wargame engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "wargame_native_engine contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
learner = ["torch>=2.2,<3"]

[project.scripts]
wargame-native-run = "wargame_native_engine.cli.run_game:main"
wargame-native-fairness = "wargame_native_engine.cli.evaluate_fairness:main"
wargame-native-import = "wargame_native_engine.cli.import_scenario:main"
wargame-native-import-history = "wargame_native_engine.cli.import_historical_replay:main"
wargame-native-align = "wargame_native_engine.cli.align_replay:main"
wargame-native-calibrate = "wargame_native_engine.cli.calibrate_rules:main"
wargame-native-evaluate-calibrated = "wargame_native_engine.cli.evaluate_calibrated_rules:main"
wargame-native-inspect-source-frame = "wargame_native_engine.cli.inspect_source_frame:main"
wargame-native-direct-fire = "wargame_native_engine.cli.resolve_direct_fire:main"
wargame-native-source-compatible = "wargame_native_engine.cli.run_source_compatible_game:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wargame_native_engine.viewer" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.data-files]
"config/rulesets" = [
    "config/rulesets/boarding_profiles_v1.json",
    "config/rulesets/boarding_type_assignments_v1.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [".", "src"]
